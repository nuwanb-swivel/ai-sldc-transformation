name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: teampulse
          POSTGRES_PASSWORD: teampulse
          POSTGRES_DB: teampulse
        ports:
          - 1999:5432
        options: >-
          --health-cmd "pg_isready -U teampulse -d teampulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://teampulse:teampulse@localhost:1999/teampulse
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-sensitive

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
