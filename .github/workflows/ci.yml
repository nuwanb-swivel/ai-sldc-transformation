name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: teampulse
          POSTGRES_PASSWORD: teampulse
          POSTGRES_DB: teampulse
        ports:
          - 1999:5432
        options: >-
          --health-cmd "pg_isready -U teampulse -d teampulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://teampulse:teampulse@localhost:1999/teampulse
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-sensitive
      # Single source of truth for the e2e test user's password -- both the
      # seed step below and `npm run test:e2e` (which reads
      # `E2E_TEST_PASSWORD` itself, see e2e/login.spec.ts and
      # e2e/loading.spec.ts) use this same env var instead of each hardcoding
      # the literal separately.
      E2E_TEST_PASSWORD: correct-horse-battery-staple

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed e2e test user
        run: npm run db:seed -- --username e2e.employee --password "$E2E_TEST_PASSWORD"

      - name: E2E tests
        run: npm run test:e2e

      - name: Visual regression (Percy)
        # Without PERCY_TOKEN, percySnapshot() no-ops and this step would just
        # rerun the full build+start+Playwright suite for no benefit -- skip
        # it entirely until a human adds the PERCY_TOKEN repo secret.
        if: ${{ secrets.PERCY_TOKEN != '' }}
        run: npm run test:visual
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
