<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeamPulse — Login (key screen)</title>
<style>
/*
  Governs: DESIGN.md Colors (error / error-bg — form and auth failures only),
  Typography (display for wordmark/title, label, body, caption), Components
  (input — 48px/border-default/border-focus/focus-ring, button-primary — 48px/
  brand-primary/hover), Shapes (rounded.md).
  EXPERIENCE.md Information Architecture (Login — App open, unauthenticated,
  username/password auth gate), Foundation (auth-gated end to end, no anonymous
  access, no SSO in v1), State Patterns (Login failure — inline error under the
  form: "Incorrect username or password.", fields retain entered username),
  Accessibility Floor (form errors associated via aria-describedby, not color
  alone).
*/
:root{
  --brand-primary:#5B5CF6;
  --brand-primary-hover:#4B4CE6;
  --text-primary:#111318;
  --text-secondary:#5F636D;
  --text-muted:#8B909A;
  --text-inverse:#FFFFFF;
  --bg-page:#FFFFFF;
  --border-default:#DADCE2;
  --error:#D94A4A; --error-bg:#FDEEEE;
  --radius-md:10px;
  --focus-ring:0 0 0 3px rgba(91,92,246,0.20);
}
*{box-sizing:border-box;}
body{
  margin:0;
  padding:40px 16px;
  background:#EDEEF2;
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  display:flex;
  flex-wrap:wrap;
  gap:32px;
  justify-content:center;
  align-items:flex-start;
}
.section-label{
  width:390px;
  font-size:14px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-bottom:8px;
}
.phone{
  width:390px;
  border-radius:40px;
  background:#0B0C0F;
  padding:10px;
  box-shadow:0 24px 48px rgba(16,18,24,0.28);
}
.screen{
  background:var(--bg-page);
  border-radius:30px;
  overflow:hidden;
  min-height:760px;
  display:flex;
  flex-direction:column;
}
.status-bar{ height:28px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-muted); }
.login-form{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:24px;
  padding:32px 28px 64px;
}
.brand{
  text-align:center;
  font-size:32px;
  font-weight:600;
  line-height:1.2;
  letter-spacing:-0.02em;
  color:var(--text-primary);
  margin-bottom:8px;
}
.tagline{
  text-align:center;
  font-size:14px;
  color:var(--text-secondary);
  margin-top:-16px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field label{
  font-size:14px; font-weight:500; color:var(--text-primary);
}
.field input{
  height:48px;
  font-family:inherit;
  font-size:16px;
  color:var(--text-primary);
  border:1px solid var(--border-default);
  border-radius:var(--radius-md);
  padding:0 14px;
  background:var(--bg-page);
  outline:none;
}
.field input.focused{
  border-color:var(--brand-primary);
  box-shadow:var(--focus-ring);
}
.field input.error-field{
  border-color:var(--error);
}
.error-msg{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--error-bg);
  color:var(--error);
  font-size:14px;
  font-weight:500;
  border-radius:var(--radius-md);
  padding:10px 14px;
}
.error-msg svg{ width:16px; height:16px; flex-shrink:0; }
.submit-btn{
  height:48px;
  border-radius:var(--radius-md);
  border:none;
  background:var(--brand-primary);
  color:var(--text-inverse);
  font-size:16px;
  font-weight:500;
  cursor:pointer;
}
</style>
</head>
<body>

<div>
  <div class="section-label">State 1 — Default</div>
  <div class="phone">
    <div class="screen">
      <div class="status-bar">9:41</div>
      <form class="login-form">
        <div class="brand">TeamPulse</div>
        <div class="tagline">Sign in to view and submit ideas</div>
        <div class="field">
          <label for="u1">Username</label>
          <input id="u1" type="text" placeholder="e.g. priya.n" />
        </div>
        <div class="field">
          <label for="p1">Password</label>
          <input id="p1" class="focused" type="password" placeholder="Password" />
        </div>
        <button type="button" class="submit-btn">Sign in</button>
      </form>
    </div>
  </div>
</div>

<div>
  <div class="section-label">State 2 — Inline login failure</div>
  <div class="phone">
    <div class="screen">
      <div class="status-bar">9:41</div>
      <form class="login-form">
        <div class="brand">TeamPulse</div>
        <div class="tagline">Sign in to view and submit ideas</div>
        <div class="field">
          <label for="u2">Username</label>
          <input id="u2" type="text" value="priya.n" />
        </div>
        <div class="field">
          <label for="p2">Password</label>
          <input id="p2" class="error-field" type="password" value="" placeholder="Password" aria-describedby="login-error" />
        </div>
        <div id="login-error" class="error-msg" role="alert">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v4M8 11h.01"/></svg>
          Incorrect username or password.
        </div>
        <button type="button" class="submit-btn">Sign in</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
