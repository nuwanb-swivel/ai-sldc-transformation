services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse
      POSTGRES_DB: teampulse
    ports:
      - '1999:5432'
    volumes:
      - teampulse_pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teampulse -d teampulse']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  teampulse_pgdata:
